<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Characters | RP</title><meta name="theme-color" content="#0e111a">
<style>
:root{color-scheme:dark;--bg:#0e111a;--fg:#f4efe8;--gold:#d7b98b;--muted:#b9b6ba;--line:rgba(231,215,193,.23)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif}a{color:inherit;text-decoration:none}a:hover{color:var(--gold)}
header{padding:22px max(20px,calc((100vw - 1100px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:26px Georgia,serif;letter-spacing:.13em}
main{max-width:1100px;margin:auto;padding:60px 22px 90px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.24em;font-size:11px}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(42px,8vw,77px);margin:5px 0 12px}h1 span{color:var(--gold)}.lead{color:var(--muted);margin-bottom:34px}
.directory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:34px}.person{border:1px solid var(--line);background:#181b26;display:flex;align-items:center;flex-direction:column;padding:25px 10px;cursor:pointer;color:var(--fg);font:inherit;gap:9px;transition:border-color .2s;text-align:center}.person:hover,.person.active{border-color:var(--gold)}.person img{border-radius:50%;width:110px;height:110px;object-fit:cover;object-position:50% 12%;border:2px solid var(--gold)}.person strong{font:clamp(17px,2.5vw,23px) Georgia,serif}.person small{color:var(--muted)}
.profile{border:1px solid var(--line);padding:clamp(20px,4vw,38px)}.top{display:flex;align-items:center;gap:23px;flex-wrap:wrap}.portrait{width:125px;height:125px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;object-position:50% 12%}h2{font-size:clamp(29px,5vw,43px);margin:2px 0}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:28px 0 34px;padding-top:24px;border-top:1px solid var(--line)}.field small{display:block;font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}.field strong{font-weight:500}
h3{font-size:27px;margin:22px 0 16px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.look{display:block;overflow:hidden;border:1px solid var(--line);background:#191b24;color:var(--fg);text-decoration:none}.look:hover{border-color:var(--gold)}.look img{display:block;aspect-ratio:3/4;width:100%;object-fit:cover}.look span{display:block;padding:8px 10px;text-transform:capitalize;color:var(--gold);font-size:12px}.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}.search{flex:1;min-width:180px;background:#181b26;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font:inherit}.search:focus{outline:1px solid var(--gold)}.page-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin:-12px 0 30px}.page-nav[hidden]{display:none}.page-nav button{background:#181b26;border:1px solid var(--line);color:var(--fg);padding:9px 15px;border-radius:5px;cursor:pointer}.page-nav button:disabled{opacity:.4;cursor:default}.page-nav button:not(:disabled):hover{border-color:var(--gold)}.counter{color:var(--muted);font-size:12px}.empty{grid-column:1/-1;color:var(--muted);padding:20px;text-align:center}.plots{border:1px dashed var(--line);padding:18px;color:var(--muted)}footer{text-align:center;color:var(--muted);border-top:1px solid var(--line);padding:24px}
@media(max-width:640px){.directory{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.person{padding:15px 3px}.person img{width:min(22vw,90px);height:min(22vw,90px)}.person strong{font-size:15px}.person small{font-size:10px}.fields{grid-template-columns:repeat(2,1fr)}.gallery{grid-template-columns:repeat(2,1fr)}main{padding:35px 15px 70px}}
</style></head><body>
<header><a class="brand" href="../index.html">RP</a><a href="../index.html">← All Worlds</a></header>
<main><div class="eyebrow">Roleplay Character Archive</div><h1>Characters<span>.</span></h1><p class="lead">Choose a character to see her profile, outfits, and suitable plots.</p>
<div class="tools"><input class="search" id="search" type="search" placeholder="Search characters, countries, genres…" aria-label="Search characters"><span class="counter" id="count"></span></div><div class="directory" id="directory" aria-label="Choose a character"></div><div class="page-nav" id="page-nav"><button id="previous" type="button">← Previous</button><span class="counter" id="page-label"></span><button id="next" type="button">Next →</button></div>
<article class="profile" id="profile" aria-live="polite"><div class="top"><img id="portrait" class="portrait" alt=""><div><div class="eyebrow" id="number"></div><h2 id="name"></h2><div id="native" style="color:var(--gold)"></div></div></div>
<div class="fields" id="fields"></div><h3>Outfit Gallery</h3><div class="gallery" id="gallery"></div><h3>Suitable Plots</h3><div class="plots" id="plots">Plots linked to this character will appear here.</div></article>
</main><footer>RP · Every character has a story.</footer>
<script>
const characters=[
{id:'rei',code:'RPC 001',name:'Rei Kurosaki',native:'黒崎 怜',age:24,country:'Japan',height:'165 cm',bust:'C-cup',genres:'Romance · Slice of Life · Drama · Mature · Mystery',folder:'ReiKurosaki'},
{id:'seoyeun',code:'RPC 002',name:'Lee Seoyeun',native:'이서연',age:24,country:'South Korea',height:'167 cm',bust:'C-cup',genres:'Romance · Slice of Life · Drama · Luxury · Mature',folder:'lee-seoyeun'},
{id:'yuxi',code:'RPC 003',name:'Lin Yuxi',native:'林语汐',age:23,country:'China',height:'163 cm',bust:'C-cup',genres:'Romance · Slice of Life · Drama · Mature · Historical',folder:'zhang-jiale'},
{id:'harper',code:'RPC 004',name:'Harper Bennett',native:'',age:26,country:'United States',height:'168 cm',bust:'D-cup',genres:'Romance · Slice of Life · Drama · Mature · Adventure',folder:'harper-bennett'},
{id:'ayaka',code:'RPC 005',name:'Ayaka Mizuno',native:'水野 彩花',age:23,country:'Japan',height:'162 cm',bust:'C-cup',genres:'Romance · Slice of Life · Drama · Mature',folder:'ayaka-mizuno',outfits:['normal','normal2','formal','party','swimwear','lingerie','sporty','cultural']},
{id:'clara',code:'RPC 006',name:'Clara Whitmore',native:'',age:27,country:'United States',height:'166 cm',bust:'C-cup',genres:'Romance · Slice of Life · Drama · Mature',folder:'clara-whitmore',portrait:'normal2',outfits:['normal2','formal','party','swimwear','lingerie','sporty']},
{id:'mio',code:'RPC 007',name:'Mio Kanzaki',native:'神崎 美緒',age:22,country:'Japan',height:'158 cm',bust:'B-cup',genres:'Romance · Slice of Life · Drama · Mature',folder:'mio-kanzaki',outfits:['normal','normal2','formal','party','swimwear','lingerie','sporty','cultural']},
{id:'sophie',code:'RPC 008',name:'Sophie Laurent',native:'',age:38,country:'France',height:'169 cm',bust:'D-cup',genres:'Romance · Slice of Life · Drama · Mature · Mystery',folder:'sophie-laurent',outfits:['normal','normal2','formal','party','swimwear','lingerie','sporty']},
{id:'charlotte',code:'RPC 009',name:'Charlotte Brooks',native:'',occupation:'University student · Psychology major',age:20,country:'United Kingdom',height:'168 cm',bust:'C-cup',genres:'College Life · Romance · Slice of Life · Drama · Mature',folder:'charlotte-brooks',outfits:['normal','normal2','formal','party','swimwear','lingerie','sporty']},
{id:'haerin',code:'RPC 010',name:'Yoon Haerin',native:'윤하린',age:24,country:'South Korea',height:'165 cm',bust:'C-cup',genres:'Romance · Slice of Life · Drama',folder:'yoon-haerin',outfits:['normal','normal2','formal','party','swimwear','lingerie','sporty']},
{id:'nanami',code:'RPC 011',name:'Nanami Kurosawa',native:'黒沢 七海',occupation:'Hospitality & Events Executive',age:23,country:'Japan',height:'164 cm',bust:'C-cup',genres:'Romance · Slice of Life · Drama · Mature',folder:'nanami-kurosawa',outfits:['normal','normal2','formal','party','swimwear','lingerie','sporty']},
{id:'shiori',code:'RPC 012',name:'Shiori Kirishima',native:'霧島 詩織',occupation:'University student · Psychology',age:20,country:'Japan',height:'160 cm',bust:'C-cup',genres:'University Life · Romance · Slice of Life · Drama · Mystery',folder:'shiori-kirishima',outfits:['normal','normal2','formal','party','swimwear','lingerie','sporty']},
{id:'miyu',code:'RPC 013',name:'Miyu Asakura',native:'朝倉 美優',occupation:'University student · Fashion & Marketing',age:22,country:'Japan',height:'163 cm',bust:'C-cup',genres:'University Life · Romance · Slice of Life · Drama · Mature',folder:'miyu-asakura',outfits:['normal','normal2','formal','party','swimwear','lingerie','sporty']}
]; 
const outfits=['normal','normal2','formal','party','swimwear','lingerie','sporty','cultural'];
const root=document.getElementById('directory');
const PAGE_SIZE=9;let currentPage=0;let searchTerm='';let activeId='';
const cardImage=(c)=>imgSrc(c,c.portrait||'normal');
function renderDirectory(){const filtered=characters.filter(c=>[c.name,c.native,c.country,c.code,c.genres,c.occupation||''].join(' ').toLowerCase().includes(searchTerm));const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));currentPage=Math.max(0,Math.min(currentPage,totalPages-1));root.replaceChildren();for(const c of filtered.slice(currentPage*PAGE_SIZE,(currentPage+1)*PAGE_SIZE)){const btn=document.createElement('button');btn.className='person';btn.dataset.id=c.id;btn.type='button';btn.setAttribute('aria-label','View '+c.name);btn.setAttribute('aria-pressed',String(c.id===activeId));btn.classList.toggle('active',c.id===activeId);const picture=document.createElement('img');picture.src=cardImage(c);picture.alt='';picture.loading='lazy';picture.onerror=()=>missingImage(picture);const title=document.createElement('strong');title.textContent=c.name;const caption=document.createElement('small');caption.textContent=c.code;btn.append(picture,title,caption);btn.addEventListener('click',()=>select(c.id,true));root.append(btn)}if(!filtered.length){const msg=document.createElement('p');msg.className='empty';msg.textContent='No characters found. Try a different search.';root.append(msg)}document.getElementById('count').textContent=filtered.length+' character'+(filtered.length===1?'':'s');document.getElementById('page-label').textContent='Page '+(currentPage+1)+' of '+totalPages;document.getElementById('previous').disabled=currentPage===0;document.getElementById('next').disabled=currentPage>=totalPages-1;document.getElementById('page-nav').hidden=filtered.length<=PAGE_SIZE}
document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();currentPage=0;renderDirectory()});
document.getElementById('previous').addEventListener('click',()=>{currentPage--;renderDirectory()});
document.getElementById('next').addEventListener('click',()=>{currentPage++;renderDirectory()});
const imgSrc=(c,o)=>encodeURI('./'+c.folder+'/'+o+'.webp');
function missingImage(image){image.onerror=null;image.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="0 0 320 420"><rect width="320" height="420" fill="#20212d"/><text x="160" y="210" text-anchor="middle" fill="#d7b98b" font-size="18" font-family="Arial">Image pending</text></svg>')}
function select(id,scroll=false){const c=characters.find(x=>x.id===id)||characters[0];activeId=c.id;document.querySelectorAll('.person').forEach(el=>{const active=el.dataset.id===c.id;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))});document.getElementById('portrait').src=imgSrc(c,c.portrait||'normal');document.getElementById('portrait').alt=c.name;document.getElementById('portrait').onerror=()=>missingImage(document.getElementById('portrait'));
document.getElementById('number').textContent=c.code;document.getElementById('name').textContent=c.name;document.getElementById('native').textContent=c.native;
const f=document.getElementById('fields');f.replaceChildren();for(const [label,value] of [['Name',c.name],['Age',c.age],['Country',c.country],['Height',c.height],['Bust',c.bust],...(c.occupation?[['Occupation',c.occupation]]:[]),['RP Genre',c.genres]]){const el=document.createElement('div');el.className='field';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=value;el.append(small,strong);f.append(el)}
const g=document.getElementById('gallery');g.replaceChildren();for(const o of (c.outfits||outfits)){const a=document.createElement('a');a.className='look';a.href=imgSrc(c,o);a.target='_blank';a.rel='noopener';const image=document.createElement('img');image.loading='lazy';image.src=imgSrc(c,o);image.alt=c.name+' — '+o;image.onerror=()=>missingImage(image);const label=document.createElement('span');label.textContent=o==='normal2'?'Normal 2':o;a.append(image,label);g.append(a)}
if(location.hash!==('#'+c.id))history.replaceState(null,'','#'+c.id);
if(scroll)document.getElementById('profile').scrollIntoView({behavior:'smooth',block:'start'});
}
const initialIndex=characters.findIndex(c=>c.id===location.hash.slice(1));if(initialIndex>=0)currentPage=Math.floor(initialIndex/PAGE_SIZE);renderDirectory();
select(location.hash.slice(1));window.addEventListener('hashchange',()=>{const idx=characters.findIndex(c=>c.id===location.hash.slice(1));if(idx>=0&&!searchTerm){currentPage=Math.floor(idx/PAGE_SIZE);renderDirectory()}select(location.hash.slice(1))});
</script></body></html>
