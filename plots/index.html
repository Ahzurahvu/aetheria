<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One-Off Plots | RP</title>
<style>:root{color-scheme:dark;--bg:#0e111a;--fg:#f4efe8;--gold:#d7b98b;--muted:#b9b6ba;--line:rgba(231,215,193,.25)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.75 system-ui,sans-serif}header{padding:22px max(20px,calc((100vw - 1040px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between}a{color:inherit;text-decoration:none}a:hover{color:var(--gold)}.brand{font:26px Georgia,serif;letter-spacing:.15em}main{max-width:1040px;padding:60px 20px 90px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:clamp(42px,8vw,75px);margin:4px 0 8px}h1 em{color:var(--gold)}.lead{color:var(--muted);margin-bottom:35px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{border:1px solid var(--line);background:#1a1c27;text-align:left;color:var(--fg);padding:25px;cursor:pointer;font:inherit}.card:hover,.card.active{border-color:var(--gold)}.card h2{margin:8px 0;font-size:24px}.card p{color:var(--muted);margin:0;font-size:13px}.detail{margin-top:30px;padding:clamp(20px,4vw,36px);border:1px solid var(--line)}.detail h2{font-size:clamp(30px,5vw,45px);margin:7px 0 12px}.story{white-space:pre-wrap;line-height:1.9;color:#ded7d2}.meta{color:var(--gold);font-size:13px}.recommended{border-top:1px solid var(--line);margin-top:32px;padding-top:20px}.recommended p{color:var(--muted)}button{touch-action:manipulation}footer{text-align:center;color:var(--muted);border-top:1px solid var(--line);padding:24px}@media(max-width:650px){main{padding-top:34px}.list{grid-template-columns:1fr}.card{padding:20px}}</style></head><body>
<header><a class="brand" href="../index.html">RP</a><a href="../index.html">← All Worlds</a></header><main><div class="eyebrow">Standalone Scenarios</div><h1>One-Off <em>Plots.</em></h1><p class="lead">Five independent roleplay openings. Choose a plot to read its setup and opening scene.</p><div class="list" id="list"></div><article class="detail" id="detail"><div class="eyebrow" id="number"></div><h2 id="title"></h2><p class="meta" id="genre"></p><h2 style="font-size:23px;margin-top:32px">Scenario</h2><p id="synopsis"></p><h2 style="font-size:23px;margin-top:28px">Opening Scene</h2><div class="story" id="story"></div><div class="recommended"><h2 style="font-size:23px">Recommended Characters</h2><p>Character recommendations will be linked here.</p><a href="../rpc/index.html" style="color:var(--gold)">Browse RPC Characters ↗</a></div></article></main><footer>RP · Every plot starts somewhere.</footer>
<script>const plots=[{"title":"Hinge Date Goes Too Well","genre":"Romance · Modern Day","synopsis":"After a month of messages and a first date full of chemistry, two adults return to an apartment for one last drink.","opening":"We’ve been talking on Hinge for almost a month now. What started as normal small talk slowly turned into longer messages, inside jokes, and then the kind of flirty, teasing comments that made both of us check our phones a little too often. Today was the first time we actually met. Dinner was good, the drinks were better, and the tension between us never really dropped—every look and accidental touch felt heavier than it should have. When the night started winding down, I was the one who suggested we go back to my place “for one more drink.”\n\nThe door clicks shut behind us and the apartment suddenly feels a lot smaller. I kick my shoes off and turn to face you, a little smile tugging at my mouth as I take you in. You’ve been looking at me like that since the second drink, and it’s been driving me crazy.\n\nI step closer, fingers lightly catching the hem of your shirt as I glance up at you.\n\n“Still want that drink?” I ask, voice softer than it was at the bar. “Or are we skipping straight to the part where I finally get you out of these clothes?”\n\nI don’t move away. I just wait, close enough that you can feel the warmth between us, giving you the chance to answer."},{"title":"Blackmail (Popular Teacher)","genre":"Thriller · School Drama","synopsis":"An adult student has a photograph that threatens a beloved teacher’s career. The confrontation becomes a dangerous game of secrets and leverage.","opening":"She’s the most popular teacher in the school—young, beautiful, and genuinely kind. Students actually like her. What no one knows is that she has a secret. One day after school, an adult student accidentally discovered something she never wanted anyone to see and took a photograph.\n\nThe last bell rang twenty minutes ago. Most of the building is empty. I step into your classroom and close the door behind me, phone already in my hand.\n\nYou’re at your desk, looking up with that same warm smile you give everyone… until you see the look on my face. I turn the screen toward you and let you see the photo.\n\n“I wasn’t going to say anything,” I tell you, voice quiet. “But then I realized how easy it would be for this to get around. It could ruin your reputation.”\n\nI step away from the door, watching you.\n\n“So… what are you willing to tell me to convince me to keep this to myself?”"},{"title":"Hotel Mix-up","genre":"Meet-Cute · Comedy · Drama","synopsis":"Two adults unexpectedly find themselves assigned to the same hotel room after a check-in mistake.","opening":"You’ve just finished a long day and stepped into the shower. The person who walks in has just broken up. They’re tired, distracted, and fully believe the room is empty when they tap the key card.\n\nThe key card beeps and the door opens. I drop my bag by the entrance, already pulling at my collar as I head toward the bathroom to wash the day off. The door’s half-open. I push it the rest of the way without thinking—\n\nAnd freeze.\n\nYou’re standing in the shower. I quickly turn my back, ears burning.\n\n“Shit—I—why are you in my room?” I manage, voice rough, retreating into the hallway. “I just checked in. This is supposed to be empty.”"},{"title":"Star Football Player","genre":"Campus Drama · Sports","synopsis":"A university football star desperately needs to pass an exam to remain eligible, and asks her professor for one last chance.","opening":"She’s the star of the university football team. Everyone knows her name. What most people don’t know is that she’s failing one class hard enough that she won’t be eligible to play unless she passes the upcoming exam. She’s already tried everything else. Now she’s standing in her professor’s office after hours, hoping for one last legitimate opportunity.\n\nThe hallway is empty. I knock once, then push the door open and step inside, closing it behind me.\n\n“I need to pass,” I say, voice steady even if my hands aren’t. “If I fail this exam I’m benched for the season. I’ve studied. I’ve done the extra credit. It’s not enough.”\n\nI hold your gaze.\n\n“Please tell me if there’s something else I can do to earn my grade. One more assignment, one more chance—anything that’s fair. I just want to play.”"},{"title":"Stepmom + Son’s Friend","genre":"Domestic Drama · Romance","synopsis":"A woman and her adult son's adult friend find themselves alone one evening, navigating unspoken attraction and complicated boundaries.","opening":"Your adult son's friend has been coming over more lately. He’s polite, easy to talk to, and you’ve noticed the way he looks at you when he thinks you aren’t paying attention. Tonight your son is out late. It’s just the two of you in the house.\n\nThe house is quiet. You’re in the kitchen in an oversized shirt and shorts, barefoot, when he walks in looking for a glass of water. He stops when he sees you.\n\nYou turn, leaning back against the counter.\n\n“Couldn’t sleep either?” you ask, voice soft. You watch him for a second, then nod toward the fridge. “There’s something to drink if you want one. Or… you can just stay here for a bit.”\n\nYou pause, aware that the easy friendship between you has become more complicated.\n\n“My son won’t be home for a while,” you add quietly. “If there's something on your mind, we can talk about it.”"}];const list=document.getElementById('list');function show(i,scroll=false){const p=plots[i]||plots[0];document.querySelectorAll('.card').forEach((x,j)=>{x.classList.toggle('active',j===i);x.setAttribute('aria-pressed',String(j===i))});document.getElementById('number').textContent='PLOT '+String(i+1).padStart(3,'0');document.getElementById('title').textContent=p.title;document.getElementById('genre').textContent=p.genre;document.getElementById('synopsis').textContent=p.synopsis;document.getElementById('story').textContent=p.opening;if(location.hash!=='#plot-'+(i+1))history.replaceState(null,'','#plot-'+(i+1));if(scroll)document.getElementById('detail').scrollIntoView({behavior:'smooth'})}plots.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='card';b.innerHTML='<span class="eyebrow">PLOT '+String(i+1).padStart(3,'0')+'</span>';const h=document.createElement('h2');h.textContent=p.title;const d=document.createElement('p');d.textContent=p.synopsis;b.append(h,d);b.addEventListener('click',()=>show(i,true));list.append(b)});function fromHash(){const m=location.hash.match(/^#plot-(\d+)$/);show(m?Math.max(0,Math.min(plots.length-1,Number(m[1])-1)):0)}fromHash();window.addEventListener('hashchange',fromHash);</script></body></html>
